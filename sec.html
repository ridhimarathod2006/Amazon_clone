<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Product Purchase Box</title>
<style>
    body {
        font-family: Arial, sans-serif;
    }
    .purchase-box {
        width: 250px;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 15px;
    }
    .price {
        font-size: 24px;
        font-weight: bold;
    }
    .delivery {
        font-size: 14px;
        color: #555;
        margin-top: 5px;
    }
    .delivery span {
        color: green;
        font-weight: bold;
    }
    .location {
        font-size: 14px;
        margin-top: 5px;
    }
    .in-stock {
        color: green;
        font-size: 16px;
        font-weight: bold;
        margin: 10px 0;
    }
    .seller-info {
        font-size: 14px;
        color: #555;
    }
    .btn {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        margin: 5px 0;
    }
    .add-to-cart {
        background-color: #FFD814;
    }
    .buy-now {
        background-color: #FFA41C;
    }
    .wishlist {
        background-color: white;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 6px;
        font-size: 14px;
        cursor: pointer;
        margin-top: 10px;
        width: 100%;
    }
</style>
</head>
<body>

<div class="purchase-box">
    <div class="price">₹590<sup>00</sup></div>
    <div class="delivery">
        FREE delivery <b>14 - 15 July</b>.<br>
        Order within <span>18 hrs 15 mins</span>. <a href="#">Details</a>
    </div>
    <div class="location">
        Delivering to Mumbai 400703 - <a href="#">Update location</a>
    </div>
    <div class="in-stock">In stock</div>
    <div class="seller-info">
        Ships from <b>Gifts n Gallery</b><br>
        Sold by <b>Gifts n Gallery</b><br>
        Payment <b>Secure transaction</b>
    </div>
    <button class="btn add-to-cart">Add to Cart</button>
    <button class="btn buy-now">Buy Now</button>
    <button class="wishlist">Add to Wish List</button>
</div>

</body>
</html>
